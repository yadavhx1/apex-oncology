<?xml version="1.0" encoding="UTF-8"?>
<!--
  apex-oncology — architecture diagram.

  THIS FILE IS THE SOURCE. Edit the text here; there is no binary master.
  It replaces a hand-made PNG whose labels could not be corrected in place,
  which is how a reference to a GEMINI.md that never existed survived in the
  README long after the file itself was gone.

  Editing notes:
    - Keep the client list in "AI Agents / MCP Clients" in step with
      .mcp/context.yaml -> entry_points.by_client.
    - Keep the file list in "AGENTS & MCP (Global)" in step with the repo root.
    - Franchise boxes mirror franchises/<F>/; add a fourth by widening the
      franchises group and reflowing the three existing boxes.
    - Layout is a plain coordinate grid — no transforms, no nesting tricks.
      Grep for a label, change it, done.

  The interactive repository tree lives in docs/repo-structure.html.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1080"
     viewBox="0 0 1480 1080" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">

  <title>apex-oncology architecture diagram</title>
  <desc>AI agents and MCP clients read repository context from AGENTS.md, CLAUDE.md,
  .mcp/context.yaml and Copilot instructions, then navigate per-franchise context,
  configuration and scripts for Venclexta, Epkinly and Imbruvica.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b84"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7bd6"/>
    </marker>
  </defs>

  <rect width="1480" height="1080" fill="#ffffff"/>

  <!-- ===================== title ===================== -->
  <text x="590" y="50" text-anchor="middle" font-size="32" font-weight="700" fill="#1e2a4a">apex-oncology</text>
  <text x="590" y="80" text-anchor="middle" font-size="21" font-weight="600" fill="#6d4aff">Architecture Diagram</text>
  <text x="590" y="103" text-anchor="middle" font-size="13" fill="#6b7a90">AI / MCP-Ready Repository Architecture</text>

  <!-- ===================== AI agents / MCP clients ===================== -->
  <rect x="240" y="120" width="700" height="98" rx="10" fill="#eef7fb" stroke="#b9dbe8"/>
  <text x="590" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#1d7fa3">AI Agents / MCP Clients</text>

  <!-- Claude — starburst mark -->
  <g stroke="#1e2a4a" stroke-width="1.6" stroke-linecap="round">
    <line x1="327" y1="164" x2="327" y2="182"/>
    <line x1="318" y1="173" x2="336" y2="173"/>
    <line x1="320.6" y1="166.6" x2="333.4" y2="179.4"/>
    <line x1="333.4" y1="166.6" x2="320.6" y2="179.4"/>
  </g>
  <text x="327" y="203" text-anchor="middle" font-size="12" fill="#33445f">Claude</text>

  <!-- VS Code / Copilot — angle brackets -->
  <g stroke="#2b6cb0" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="495,166 487,173 495,180"/>
    <polyline points="510,166 518,173 510,180"/>
  </g>
  <text x="502" y="198" text-anchor="middle" font-size="12" fill="#33445f">VS Code</text>
  <text x="502" y="211" text-anchor="middle" font-size="11" fill="#6b7a90">(Copilot)</text>

  <!-- Custom agents — small robot -->
  <g stroke="#2f8b4c" stroke-width="1.5" fill="none">
    <rect x="667" y="166" width="21" height="15" rx="4"/>
    <line x1="677.5" y1="162" x2="677.5" y2="166"/>
    <circle cx="672.5" cy="173.5" r="1.6" fill="#2f8b4c" stroke="none"/>
    <circle cx="682.5" cy="173.5" r="1.6" fill="#2f8b4c" stroke="none"/>
  </g>
  <text x="677" y="203" text-anchor="middle" font-size="12" fill="#33445f">Custom Agents</text>

  <!-- MCP tools — gear -->
  <g stroke="#b07d1a" stroke-width="1.5" fill="none">
    <circle cx="852" cy="173" r="7"/>
    <circle cx="852" cy="173" r="2.6"/>
    <line x1="852" y1="162" x2="852" y2="166"/>
    <line x1="852" y1="180" x2="852" y2="184"/>
    <line x1="841" y1="173" x2="845" y2="173"/>
    <line x1="859" y1="173" x2="863" y2="173"/>
  </g>
  <text x="852" y="203" text-anchor="middle" font-size="12" fill="#33445f">MCP Tools</text>

  <!-- ===================== agents <-> repository ===================== -->
  <line x1="470" y1="226" x2="470" y2="266" stroke="#5b6b84" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="484" y="250" font-size="12" fill="#5b6b84">Read / Query</text>

  <line x1="760" y1="266" x2="760" y2="226" stroke="#8a7bd6" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="774" y="250" font-size="12" fill="#6d4aff">Provide Context &amp; Resources</text>

  <!-- ===================== repository ===================== -->
  <rect x="140" y="276" width="900" height="524" rx="12" fill="#f7f9fc" stroke="#c7d2e3"/>
  <text x="590" y="306" text-anchor="middle" font-size="17" font-weight="700" fill="#1e2a4a">apex-oncology Repository</text>

  <!-- context layer: three peer groups -->
  <rect x="160" y="325" width="280" height="100" rx="9" fill="#ffffff" stroke="#d6ddea"/>
  <text x="176" y="348" font-size="12.5" font-weight="700" fill="#1e2a4a">AGENTS &amp; MCP (Global)</text>
  <text x="176" y="370" font-size="10.5" font-family="Consolas, monospace" fill="#5b6b84">AGENTS.md</text>
  <text x="176" y="385" font-size="10.5" font-family="Consolas, monospace" fill="#5b6b84">CLAUDE.md</text>
  <text x="176" y="400" font-size="10.5" font-family="Consolas, monospace" fill="#5b6b84">.mcp/context.yaml</text>
  <text x="176" y="415" font-size="10.5" font-family="Consolas, monospace" fill="#5b6b84">.github/copilot-instructions.md</text>

  <rect x="450" y="325" width="280" height="100" rx="9" fill="#ffffff" stroke="#d6ddea"/>
  <text x="466" y="348" font-size="12.5" font-weight="700" fill="#1e2a4a">docs/</text>
  <text x="466" y="370" font-size="10.5" fill="#5b6b84">Architecture, MCP integration,</text>
  <text x="466" y="385" font-size="10.5" fill="#5b6b84">agent workflows, conventions,</text>
  <text x="466" y="400" font-size="10.5" fill="#5b6b84">data dictionary,</text>
  <text x="466" y="415" font-size="10.5" fill="#5b6b84">interactive repo structure</text>

  <rect x="740" y="325" width="280" height="100" rx="9" fill="#ffffff" stroke="#d6ddea"/>
  <text x="756" y="348" font-size="12.5" font-weight="700" fill="#1e2a4a">templates/</text>
  <text x="756" y="370" font-size="10.5" fill="#5b6b84">Scaffolding for new franchises,</text>
  <text x="756" y="385" font-size="10.5" fill="#5b6b84">scripts and config schema</text>
  <text x="756" y="407" font-size="10.5" font-weight="600" fill="#8a94a6">vendor/</text>
  <text x="756" y="420" font-size="10.5" fill="#5b6b84">Pinned pldlib.egg + loader</text>

  <!-- franchises -->
  <rect x="160" y="440" width="860" height="215" rx="9" fill="#fdfdff" stroke="#d6ddea"/>
  <text x="590" y="464" text-anchor="middle" font-size="14" font-weight="700" fill="#1e2a4a">franchises/</text>

  <!-- Venclexta -->
  <rect x="175" y="478" width="270" height="164" rx="8" fill="#fdf2f4" stroke="#edc7cf"/>
  <text x="310" y="501" text-anchor="middle" font-size="13" font-weight="700" fill="#c0405a">Venclexta</text>
  <text x="191" y="527" font-size="11" font-weight="600" fill="#33445f">configuration/</text>
  <text x="191" y="541" font-size="10" font-family="Consolas, monospace" fill="#6b7a90">aml_dos_grace.yaml, *.json</text>
  <text x="191" y="565" font-size="11" font-weight="600" fill="#33445f">scripts/</text>
  <text x="191" y="579" font-size="10" font-family="Consolas, monospace" fill="#6b7a90">.py, .sql, .ipynb</text>
  <text x="191" y="603" font-size="11" font-family="Consolas, monospace" fill="#33445f">CONTEXT.md</text>
  <text x="191" y="625" font-size="11" font-family="Consolas, monospace" fill="#33445f">manifest.yaml</text>

  <!-- Epkinly -->
  <rect x="455" y="478" width="270" height="164" rx="8" fill="#f1faf3" stroke="#c4e4cc"/>
  <text x="590" y="501" text-anchor="middle" font-size="13" font-weight="700" fill="#2f8b4c">Epkinly</text>
  <text x="471" y="527" font-size="11" font-weight="600" fill="#33445f">configuration/</text>
  <text x="471" y="541" font-size="10" font-family="Consolas, monospace" fill="#6b7a90">*.yaml, *.json</text>
  <text x="471" y="565" font-size="11" font-weight="600" fill="#33445f">scripts/</text>
  <text x="471" y="579" font-size="10" font-family="Consolas, monospace" fill="#6b7a90">.py, .sql, .ipynb</text>
  <text x="471" y="603" font-size="11" font-family="Consolas, monospace" fill="#33445f">CONTEXT.md</text>
  <text x="471" y="625" font-size="11" font-family="Consolas, monospace" fill="#33445f">manifest.yaml</text>

  <!-- Imbruvica -->
  <rect x="735" y="478" width="270" height="164" rx="8" fill="#f1f6fd" stroke="#c5d8ef"/>
  <text x="870" y="501" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">Imbruvica</text>
  <text x="751" y="527" font-size="11" font-weight="600" fill="#33445f">configuration/</text>
  <text x="751" y="541" font-size="10" font-family="Consolas, monospace" fill="#6b7a90">*.yaml, *.json</text>
  <text x="751" y="565" font-size="11" font-weight="600" fill="#33445f">scripts/</text>
  <text x="751" y="579" font-size="10" font-family="Consolas, monospace" fill="#6b7a90">.py, .sql, .ipynb</text>
  <text x="751" y="603" font-size="11" font-family="Consolas, monospace" fill="#33445f">CONTEXT.md</text>
  <text x="751" y="625" font-size="11" font-family="Consolas, monospace" fill="#33445f">manifest.yaml</text>

  <!-- franchise -> layers -->
  <line x1="380" y1="655" x2="380" y2="670" stroke="#5b6b84" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="800" y1="655" x2="800" y2="670" stroke="#5b6b84" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- configuration layer -->
  <rect x="175" y="670" width="413" height="110" rx="9" fill="#f0faf4" stroke="#bfe3cd"/>
  <g stroke="#2f8b4c" stroke-width="1.5" fill="none">
    <ellipse cx="205" cy="700" rx="11" ry="4.5"/>
    <path d="M194 700 v12 a11 4.5 0 0 0 22 0 v-12"/>
    <line x1="194" y1="706" x2="194" y2="706"/>
  </g>
  <text x="226" y="698" font-size="13.5" font-weight="700" fill="#2f8b4c">Configuration Layer</text>
  <text x="226" y="716" font-size="10.5" fill="#5b6b84">Structured YAML / JSON supplying parameters,</text>
  <text x="226" y="731" font-size="10.5" fill="#5b6b84">paths, secret <tspan font-style="italic">names</tspan> and business-rule values.</text>
  <text x="191" y="755" font-size="10.5" fill="#5b6b84">Nothing configurable is hardcoded; no secret</text>
  <text x="191" y="769" font-size="10.5" fill="#5b6b84">values and no patient-level data are committed.</text>

  <!-- script execution layer -->
  <rect x="598" y="670" width="407" height="110" rx="9" fill="#f5f2fe" stroke="#d3c9f5"/>
  <g stroke="#6d4aff" stroke-width="1.5" fill="none">
    <circle cx="628" cy="700" r="8"/>
    <circle cx="628" cy="700" r="3"/>
    <line x1="628" y1="687" x2="628" y2="692"/>
    <line x1="628" y1="708" x2="628" y2="713"/>
    <line x1="615" y1="700" x2="620" y2="700"/>
    <line x1="636" y1="700" x2="641" y2="700"/>
  </g>
  <text x="649" y="698" font-size="13.5" font-weight="700" fill="#6d4aff">Script Execution Layer</text>
  <text x="649" y="716" font-size="10.5" fill="#5b6b84">Python, SQL and notebooks consume config,</text>
  <text x="649" y="731" font-size="10.5" fill="#5b6b84">process data and emit outputs.</text>
  <text x="614" y="755" font-size="10.5" fill="#5b6b84">Run-time user inputs — dates, market and product</text>
  <text x="614" y="769" font-size="10.5" fill="#5b6b84">filters — are surfaced, never autofilled.</text>

  <!-- ===================== repository -> runtime ===================== -->
  <line x1="590" y1="800" x2="590" y2="838" stroke="#5b6b84" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="840" width="700" height="104" rx="10" fill="#fbfcfe" stroke="#d6ddea"/>

  <g stroke="#2b6cb0" stroke-width="1.5" fill="none">
    <ellipse cx="300" cy="872" rx="11" ry="4.5"/>
    <path d="M289 872 v14 a11 4.5 0 0 0 22 0 v-14"/>
  </g>
  <text x="322" y="871" font-size="12.5" font-weight="700" fill="#1e2a4a">Data Sources</text>
  <text x="322" y="888" font-size="10.5" fill="#6b7a90">Databases, files, APIs,</text>
  <text x="322" y="902" font-size="10.5" fill="#6b7a90">data lake</text>

  <g stroke="#b07d1a" stroke-width="1.5" fill="none">
    <circle cx="540" cy="874" r="10"/>
    <polyline points="540,868 540,874 545,877"/>
  </g>
  <text x="560" y="871" font-size="12.5" font-weight="700" fill="#1e2a4a">Scheduling</text>
  <text x="560" y="888" font-size="10.5" fill="#6b7a90">Airflow, Autosys, ADF,</text>
  <text x="560" y="902" font-size="10.5" fill="#6b7a90">cron</text>

  <g stroke="#2f8b4c" stroke-width="1.6" fill="none" stroke-linecap="round">
    <line x1="762" y1="882" x2="762" y2="868"/>
    <line x1="769" y1="882" x2="769" y2="862"/>
    <line x1="776" y1="882" x2="776" y2="872"/>
  </g>
  <text x="792" y="871" font-size="12.5" font-weight="700" fill="#1e2a4a">Outputs</text>
  <text x="792" y="888" font-size="10.5" fill="#6b7a90">Tables, reports,</text>
  <text x="792" y="902" font-size="10.5" fill="#6b7a90">dashboards</text>

  <!-- ===================== sidebar: key benefits ===================== -->
  <rect x="1160" y="276" width="280" height="270" rx="10" fill="#f1faf3" stroke="#c4e4cc"/>
  <text x="1300" y="303" text-anchor="middle" font-size="14" font-weight="700" fill="#2f8b4c">Key Benefits</text>

  <path d="M1178 320 l4 4 l7 -8" stroke="#2f8b4c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="1196" y="324" font-size="11" fill="#33445f">Franchise-scoped context keeps</text>
  <text x="1196" y="337" font-size="11" fill="#33445f">retrieval small and correct</text>

  <path d="M1178 362 l4 4 l7 -8" stroke="#2f8b4c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="1196" y="366" font-size="11" fill="#33445f">Machine-readable manifests make</text>
  <text x="1196" y="379" font-size="11" fill="#33445f">script-to-config links explicit</text>

  <path d="M1178 404 l4 4 l7 -8" stroke="#2f8b4c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="1196" y="408" font-size="11" fill="#33445f">Configuration stays out of code,</text>
  <text x="1196" y="421" font-size="11" fill="#33445f">so business rules are reviewable</text>

  <path d="M1178 446 l4 4 l7 -8" stroke="#2f8b4c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="1196" y="450" font-size="11" fill="#33445f">MCP can expose narrow resources</text>
  <text x="1196" y="463" font-size="11" fill="#33445f">instead of whole-repo access</text>

  <path d="M1178 488 l4 4 l7 -8" stroke="#2f8b4c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="1196" y="492" font-size="11" fill="#33445f">Templates keep the fifth franchise</text>
  <text x="1196" y="505" font-size="11" fill="#33445f">shaped like the first</text>

  <text x="1178" y="531" font-size="10" fill="#6b7a90">Full rules: AGENTS.md — the entry point.</text>

  <!-- ===================== sidebar: context chain ===================== -->
  <rect x="1160" y="560" width="280" height="240" rx="10" fill="#f7f9fc" stroke="#d6ddea"/>
  <text x="1300" y="587" text-anchor="middle" font-size="14" font-weight="700" fill="#1e2a4a">Context Chain</text>
  <text x="1178" y="606" font-size="10" fill="#6b7a90">Enter as far down as the question allows.</text>

  <rect x="1178" y="617" width="244" height="24" rx="6" fill="#ffffff" stroke="#d6ddea"/>
  <text x="1190" y="633" font-size="10.5" font-family="Consolas, monospace" fill="#33445f">AGENTS.md</text>
  <line x1="1300" y1="641" x2="1300" y2="650" stroke="#5b6b84" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="1178" y="651" width="244" height="24" rx="6" fill="#ffffff" stroke="#d6ddea"/>
  <text x="1190" y="667" font-size="10.5" font-family="Consolas, monospace" fill="#33445f">.mcp/context.yaml</text>
  <line x1="1300" y1="675" x2="1300" y2="684" stroke="#5b6b84" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="1178" y="685" width="244" height="24" rx="6" fill="#ffffff" stroke="#d6ddea"/>
  <text x="1190" y="701" font-size="10.5" font-family="Consolas, monospace" fill="#33445f">franchises/&lt;F&gt;/CONTEXT.md</text>
  <line x1="1300" y1="709" x2="1300" y2="718" stroke="#5b6b84" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="1178" y="719" width="244" height="24" rx="6" fill="#ffffff" stroke="#d6ddea"/>
  <text x="1190" y="735" font-size="10.5" font-family="Consolas, monospace" fill="#33445f">manifest.yaml</text>
  <line x1="1300" y1="743" x2="1300" y2="752" stroke="#5b6b84" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="1178" y="753" width="244" height="24" rx="6" fill="#ffffff" stroke="#d6ddea"/>
  <text x="1190" y="769" font-size="10.5" font-family="Consolas, monospace" fill="#33445f">target script → configuration/*</text>

  <text x="1178" y="792" font-size="10" fill="#6b7a90">One franchise at a time — never across.</text>

  <!-- ===================== adding a franchise ===================== -->
  <rect x="40" y="964" width="1400" height="88" rx="10" fill="#fffaf0" stroke="#f0dcb4"/>
  <text x="740" y="990" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b07d1a">How to Add a New Franchise</text>

  <circle cx="72" cy="1022" r="11" fill="#b07d1a"/>
  <text x="72" y="1026" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="90" y="1019" font-size="10.5" fill="#33445f">Copy templates/franchise/</text>
  <text x="90" y="1032" font-size="10.5" fill="#6b7a90">per TEMPLATE_FRANCHISE.md</text>
  <line x1="256" y1="1022" x2="274" y2="1022" stroke="#c9a961" stroke-width="1.3" marker-end="url(#arrow)"/>

  <circle cx="292" cy="1022" r="11" fill="#b07d1a"/>
  <text x="292" y="1026" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="310" y="1019" font-size="10.5" fill="#33445f">Complete CONTEXT.md —</text>
  <text x="310" y="1032" font-size="10.5" fill="#6b7a90">business rules and caveats</text>
  <line x1="476" y1="1022" x2="494" y2="1022" stroke="#c9a961" stroke-width="1.3" marker-end="url(#arrow)"/>

  <circle cx="512" cy="1022" r="11" fill="#b07d1a"/>
  <text x="512" y="1026" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="530" y="1019" font-size="10.5" fill="#33445f">Complete manifest.yaml</text>
  <text x="530" y="1032" font-size="10.5" fill="#6b7a90">and add configuration/</text>
  <line x1="696" y1="1022" x2="714" y2="1022" stroke="#c9a961" stroke-width="1.3" marker-end="url(#arrow)"/>

  <circle cx="732" cy="1022" r="11" fill="#b07d1a"/>
  <text x="732" y="1026" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="750" y="1019" font-size="10.5" fill="#33445f">Add scripts and register</text>
  <text x="750" y="1032" font-size="10.5" fill="#6b7a90">each in manifest.yaml</text>
  <line x1="916" y1="1022" x2="934" y2="1022" stroke="#c9a961" stroke-width="1.3" marker-end="url(#arrow)"/>

  <circle cx="952" cy="1022" r="11" fill="#c0405a"/>
  <text x="952" y="1026" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <text x="970" y="1019" font-size="10.5" font-weight="600" fill="#c0405a">Register in .mcp/context.yaml</text>
  <text x="970" y="1032" font-size="10.5" fill="#6b7a90">— the step most often missed; without it the</text>
  <text x="970" y="1045" font-size="10.5" fill="#6b7a90">franchise is invisible to MCP clients.</text>

</svg>
