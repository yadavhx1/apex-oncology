#     - ALL_CLAIMS_COMBINED_FACT_VW
#     - PRODUCT_XREF
#   outputs:
#     - VENCLEXTA_TRX_MONTHLY
#   user_inputs:
#     - reporting_period_end           # blank in the script; supplied at run time
#     - market_code
#   depends_on: []                     # other scripts that must run first
#   notes: >-
#     Anything a reader needs that the fields above don't carry — combination-regimen
#     attribution applied, known caveats, indications in scope.
