# Venclexta — script inventory and dependency metadata.
#
# Authoritative inventory for franchises/Venclexta/scripts/. Agents read this INSTEAD
# of traversing the filesystem, so an unregistered script is invisible to agents, to
# MCP and to reviewers.
#
# Register a script in the SAME change that adds or renames it.
# If this file and a script disagree, the SCRIPT is authoritative and this file is
# stale — fix it and report the drift.
#
# Field reference: templates/script-metadata.yaml
# Conventions:     docs/conventions.md

schema_version: 1

franchise:
  name: Venclexta
  generic_name: venetoclax
  context: CONTEXT.md
  owner: TODO                     # analytics owner accountable for this franchise

# ---------------------------------------------------------------------------
# Configuration files in this franchise, and what each supplies.
# Paths are relative to franchises/Venclexta/.
# ---------------------------------------------------------------------------
configuration:
  - path: configuration/aml_dos_grace.yaml
    purpose: >-
      Grace period and days-of-supply values by product for AML line-of-therapy
      validation, plus the RX days-supply fallback and excluded products.
    production_affecting: true
    update_with: /update-dos-grace

# ---------------------------------------------------------------------------
# Script inventory. One entry per file in scripts/.
# ---------------------------------------------------------------------------
scripts:

  - name: AML_LOT_VAL.ipynb
    type: notebook
    purpose: >-
      AML line-of-therapy validation — builds the treatment table with DOS and GRACE
      assigned per product, then derives episodes, regimens and lines of therapy.
    owner: TODO
    schedule: ad-hoc                    # validation notebook, not orchestrated
    configuration:
      - configuration/aml_dos_grace.yaml
    source_tables:
      - TODO                            # resolved at run time from the CWS schema
    outputs:
      - TODO                            # MABI_AML_* tables in the CWS schema
    user_inputs:
      - cws                             # target schema, set in the GLOBAL VARIABLES cell
      - data_period                     # reporting period used when staging the Tx table
    depends_on: []
    notes: >-
      DOS and GRACE were hardcoded in the SQL; they now come from
      configuration/aml_dos_grace.yaml via scripts/dos_grace_config.py. Requires
      pldlib.egg and a Spark session. Outputs are stripped in version control —
      clear them again before committing. Source and output table names still need
      recording; the notebook builds them from the `cws` schema variable.

  - name: dos_grace_config.py
    type: python
    purpose: >-
      Load and validate the DOS/GRACE configuration and build the GRACE_VALUE and
      DOS_FINAL CASE expressions consumed by AML_LOT_VAL.ipynb.
    owner: TODO
    schedule: ad-hoc                    # imported, not run directly
    configuration:
      - configuration/aml_dos_grace.yaml
    source_tables: []
    outputs: []
    user_inputs: []
    depends_on: []
    notes: >-
      Pure configuration handling — no Spark dependency, so it is testable without a
      cluster. Rejects malformed configuration rather than substituting defaults: a
      silently dropped product would change reported lines of therapy.

  - name: validate_dos_grace.py
    type: python
    purpose: >-
      Validate the DOS/GRACE configuration and show what it will apply, before a
      change reaches a query.
    owner: TODO
    schedule: ad-hoc
    configuration:
      - configuration/aml_dos_grace.yaml
    source_tables: []
    outputs: []
    user_inputs: []
    depends_on:
      - dos_grace_config.py
    notes: >-
      Run from franchises/Venclexta/scripts/. Supports --sql to print the generated
      SQL and --product to inspect one product. Used as the verification step of the
      /update-dos-grace skill. Exit 0 = valid.

  - name: test_dos_grace_config.py
    type: python
    purpose: >-
      Prove the configuration reproduces the values originally hardcoded in the
      notebook, and that the generated SQL matches the configuration.
    owner: TODO
    schedule: ad-hoc
    configuration:
      - configuration/aml_dos_grace.yaml
    source_tables: []
    outputs: []
    user_inputs: []
    depends_on:
      - dos_grace_config.py
    notes: >-
      Holds MIGRATION_BASELINE_* — a frozen snapshot of the original hardcoded
      values. An intentional value change is EXPECTED to fail these tests; update the
      baseline in the same commit with the business reason. Runs under pytest or
      standalone.
