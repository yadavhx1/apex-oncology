# Venclexta — script inventory and dependency metadata.
#
# Authoritative inventory for franchises/Venclexta/scripts/. Agents read this INSTEAD
# of traversing the filesystem, so an unregistered script is invisible to agents, to
# MCP and to reviewers.
#
# Register a script in the SAME change that adds or renames it.
# If this file and a script disagree, the SCRIPT is authoritative and this file is
# stale — fix it and report the drift.
#
# Field reference: templates/script-metadata.yaml
# Conventions:     docs/conventions.md

schema_version: 1

franchise:
  name: Venclexta
  generic_name: venetoclax
  context: CONTEXT.md
  owner: TODO                     # analytics owner accountable for this franchise

# ---------------------------------------------------------------------------
# Configuration files in this franchise, and what each supplies.
# Paths are relative to franchises/Venclexta/.
# ---------------------------------------------------------------------------
configuration: []
# - path: configuration/market_filters.yaml
#   purpose: Product and market code lists applied across reporting extracts.

# ---------------------------------------------------------------------------
# Script inventory. One entry per file in scripts/.
#
# Empty until the franchise's workloads are migrated in. An empty list means
# "no scripts registered yet" — it does not mean "look in scripts/ instead".
# ---------------------------------------------------------------------------
scripts: []

# Copy this block per script. Every field is expected; use [] or "none" rather
# than omitting a field, so a reader can tell "nothing" from "not recorded".
#
# - name: trx_monthly.sql
#   type: sql                          # python | sql | notebook
#   purpose: Monthly TRx by HCP and account for franchise reporting.
#   owner: TODO
#   schedule: monthly                  # or: ad-hoc
#   configuration:
#     - configuration/market_filters.yaml
#     - configuration/source_tables.yaml
